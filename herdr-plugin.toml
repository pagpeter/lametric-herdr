id = "lametric-herdr"
name = "LaMetric"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show agent state on a LaMetric Time: an always-on agent grid plus silent alerts."
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "lametric_herdr.py", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "lametric_herdr.py", "event"]

# Re-read the agent list on events that change it without a status event:
# viewing a finished agent turns done -> idle silently (herdr marks it seen),
# and agents appear or disappear with their panes. Unchanged icons are not
# re-sent, so frequent focus events stay cheap.

[[events]]
on = "pane.focused"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "tab.focused"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "workspace.focused"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "pane.exited"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "pane.closed"
command = ["python3", "lametric_herdr.py", "event"]

[[events]]
on = "workspace.closed"
command = ["python3", "lametric_herdr.py", "event"]

[[actions]]
id = "refresh"
title = "LaMetric: refresh"
command = ["python3", "lametric_herdr.py", "refresh"]

[[actions]]
id = "test"
title = "LaMetric: send test"
command = ["python3", "lametric_herdr.py", "test"]

[[actions]]
id = "toggle-alerts"
title = "LaMetric: toggle alerts"
command = ["python3", "lametric_herdr.py", "toggle-alerts"]
